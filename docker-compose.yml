version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: trustlayer-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: trustlayer-server
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017/trustlayer
      - JWT_SECRET=super_secret_production_ready_jwt_key_at_least_32_chars_12345
    depends_on:
      - mongo

volumes:
  mongo_data: