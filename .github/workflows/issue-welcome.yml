name: Issue Welcome Comment

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  welcome-comment:
    name: Post Welcome Comment
    runs-on: ubuntu-latest
    steps:
      - name: Add welcome comment on issue creation
        uses: actions/github-script@v7
        with:
          script: |
            const issueAuthor = context.payload.issue.user.login;

            const body = [
              `👋 Thanks for opening this issue, @${issueAuthor}!`,
              '',
              '### 📋 What happens next?',
              '- A maintainer will review your issue shortly.',
              '- Please make sure to attach any relevant context, screenshots, or error logs if applicable.',
              '- **Important:** Please do not open a Pull Request until a maintainer officially assigns this issue to you!',
              '',
              'Thank you for contributing to **TrustLayer AI**! 🚀',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
